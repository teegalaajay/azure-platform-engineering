name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: repository consistency checks (ADR-0025)
        run: |
          fail=0
          bash scripts/check-terraform-version.sh || fail=1
          bash scripts/check-cloud-init-drift.sh || fail=1
          exit "$fail"
      - id: find
        env:
          MIN_DIRS: "20"
        run: |
          dirs=$(find . -name versions.tf -not -path '*/.terraform/*' -printf '%h\n' \
            | sed 's|^\./||' | sort | jq -R . | jq -sc .)
          count=$(jq length <<< "$dirs")
          echo "found $count Terraform directories"
          if [ "$count" -lt "$MIN_DIRS" ]; then
            echo "::error::expected at least $MIN_DIRS Terraform directories, found $count"
            exit 1
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: terraform fmt
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -diff
      - name: terraform init (no backend)
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate
      - name: tflint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - name: tflint
        working-directory: ${{ matrix.dir }}
        run: tflint --config="$GITHUB_WORKSPACE/.tflint.hcl"

  gate:
    name: validate-gate
    needs: [discover, validate, secrets, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: require every validation to succeed
        env:
          DISCOVER: ${{ needs.discover.result }}
          VALIDATE: ${{ needs.validate.result }}
          SECRETS: ${{ needs.secrets.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "discover=$DISCOVER validate=$VALIDATE secrets=$SECRETS image=$IMAGE"
          if [ "$DISCOVER" != "success" ] || [ "$VALIDATE" != "success" ] \
            || [ "$SECRETS" != "success" ] || [ "$IMAGE" != "success" ]; then
            echo "::error::validation did not fully succeed"
            exit 1
          fi

  secrets:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                 # the whole history; the default shallow clone would scan one commit
          persist-credentials: false     # the Git token is not left in .git/config
      - name: install gitleaks (pinned by SHA-256)
        env:
          GITLEAKS_VERSION: 8.30.0       # the same release as the pre-commit pin
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check -   # fails the step if the hash differs
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact -v .   # every commit in history; --redact keeps any finding out of the log
      - name: no wildcard Key Vault filter, shell tracing or Terraform debug logging (ADR-0032)
        run: |
          if git grep -n -E "SecretsFilter:[[:space:]]*['\"]?[*]|set -[a-z]*[x]|TF_LO[G]" -- pipelines .github/workflows; then
            echo "::error::a pattern that can print a secret was found"
            exit 1
          fi

  image:
    name: image-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install hadolint (pinned by SHA-256, ADR-0037)
        env:
          HADOLINT_VERSION: 2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          curl -sSfL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum --check -   # fails the step if the hash differs
          chmod +x "$RUNNER_TEMP/hadolint"
      - name: install Trivy (pinned by SHA-256; signature checked by hand, ADR-0037)
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" "${BASE}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum --check -   # fails the step if the hash differs
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
      - name: lint the Dockerfile
        run: '"$RUNNER_TEMP/hadolint" containers/hello-web/Dockerfile'
      - name: build the image
        run: docker build -t hello-web:scan containers/hello-web
      - name: scan the image (HIGH and CRITICAL, fixable only)
        run: |
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 hello-web:scan
