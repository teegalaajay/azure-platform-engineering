# Multi-stage Terraform pipeline: Build (static checks) -> Plan (plan identity, publishes the plan)
# -> Deploy (added with the apply identity).
# Manual runs only. The repository is public, so no push and no pull request may start a run
# that can hold a service connection (ADR-0026).
trigger: none
pr: none

parameters:
  - name: deploy
    displayName: Run the Deploy stage (changes Azure)
    type: boolean
    default: false              # a person must tick it; the stage is Skipped otherwise (ADR-0026)
  - name: terraformRoot
    displayName: Terraform root to build, plan and deploy
    type: string
    default: workloads/pipeline-demo/dev
    values:
      - workloads/pipeline-demo/dev
      - workloads/ansible-target/dev

pool:
  vmImage: ubuntu-24.04         # pinned image, same as ado-terraform-validate; a bump is a reviewed change

variables:
  terraformVersion: 1.16.4      # the only Terraform version named in this pipeline (ADR-0025 check)
  # Hash of terraform_1.16.4_linux_amd64.zip from the SHA256SUMS signed by HashiCorp, verified 2026-10-28.
  terraformSha256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
  rootDir: ${{ parameters.terraformRoot }}   # compile time; the three $(rootDir) uses below stay unchanged

stages:
  - stage: build
    displayName: Build
    jobs:
      - job: validate
        displayName: fmt, init without a backend, validate
        timeoutInMinutes: 10
        steps:
          - template: templates/terraform-setup.yml   # checkout plus pinned Terraform install (ADR-0028)
            parameters:
              version: $(terraformVersion)
              sha256: $(terraformSha256)
          - bash: |
              set -euo pipefail
              terraform fmt -check -diff
              terraform init -backend=false -input=false
              terraform validate
            displayName: Static checks on the root
            workingDirectory: $(Build.SourcesDirectory)/$(rootDir)
          - template: templates/failure-report.yml
            parameters:
              detail: root=$(rootDir)

  - stage: plan
    displayName: Plan
    dependsOn: build
    jobs:
      - job: plan
        displayName: Plan as the plan identity
        timeoutInMinutes: 10
        steps:
          - template: templates/terraform-setup.yml   # checkout plus pinned Terraform install (ADR-0028)
            parameters:
              version: $(terraformVersion)
              sha256: $(terraformSha256)
          - template: templates/terraform-azure-step.yml
            parameters:
              display_name: terraform init and plan
              service_connection: sc-azure-plan-shared
              working_directory: $(Build.SourcesDirectory)/$(rootDir)
              script: |
                terraform init -input=false
                terraform plan -input=false -lock=false -out="$(Build.ArtifactStagingDirectory)/dev.tfplan"
          - publish: $(Build.ArtifactStagingDirectory)/dev.tfplan
            artifact: tfplan
            displayName: Publish the plan file
          - template: templates/failure-report.yml
            parameters:
              detail: root=$(rootDir)

  - stage: deploy
    displayName: Deploy
    dependsOn: plan
    condition: and(succeeded(), eq('${{ parameters.deploy }}', 'true'))
    jobs:
      - deployment: apply
        displayName: Apply the reviewed plan as the apply identity
        timeoutInMinutes: 30
        environment: pipeline-demo-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/terraform-setup.yml   # checkout plus pinned Terraform install (ADR-0028)
                  parameters:
                    version: $(terraformVersion)
                    sha256: $(terraformSha256)
                - download: current
                  artifact: tfplan
                  displayName: Download the plan file
                - template: templates/terraform-azure-step.yml
                  parameters:
                    display_name: terraform init and apply
                    service_connection: sc-azure-apply-shared
                    working_directory: $(Build.SourcesDirectory)/$(rootDir)
                    script: |
                      terraform init -input=false
                      terraform apply -input=false "$(Pipeline.Workspace)/tfplan/dev.tfplan"
                - ${{ if eq(parameters.terraformRoot, 'workloads/ansible-target/dev') }}:
                    - template: templates/terraform-azure-step.yml
                      parameters:
                        display_name: Write the handoff file
                        service_connection: sc-azure-apply-shared
                        working_directory: $(Build.SourcesDirectory)/$(rootDir)
                        script: |
                          read -r host < <(terraform output -raw target_host) || [[ -n "$host" ]]
                          read -r user < <(terraform output -raw target_user) || [[ -n "$user" ]]
                          [[ "$host" =~ ^10\.10\.1\.[0-9]{1,3}$ ]] || { echo "bad target_host"; exit 1; }
                          [[ "$user" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "bad target_user"; exit 1; }
                          mkdir -p "$(Build.ArtifactStagingDirectory)/handoff"
                          printf '{"target_host":"%s","target_user":"%s","root":"%s","commit":"%s"}\n' \
                            "$host" "$user" "${{ parameters.terraformRoot }}" "$(Build.SourceVersion)" \
                            > "$(Build.ArtifactStagingDirectory)/handoff/handoff.json"
                          cat "$(Build.ArtifactStagingDirectory)/handoff/handoff.json"
                    - publish: $(Build.ArtifactStagingDirectory)/handoff
                      artifact: handoff
                      displayName: Publish the handoff artifact
                - template: templates/failure-report.yml
                  parameters:
                    detail: root=$(rootDir)
      - ${{ if eq(parameters.terraformRoot, 'workloads/ansible-target/dev') }}:
          - job: configure
            displayName: Configure the target with Ansible from the self-hosted agent
            timeoutInMinutes: 15
            dependsOn: apply
            pool:
              name: pool-platform-shared    # the agent in snet-mgmt; the hosted image cannot reach snet-app
            steps:
              - download: current
                artifact: handoff
                displayName: Download the handoff artifact
              - bash: |
                  set -euo pipefail
                  f="$PIPELINE_WS/handoff/handoff.json"
                  test -s "$f" || { echo "handoff.json is missing or empty"; exit 1; }
                  cat "$f"
                  { read -r host; read -r user; } < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["target_host"]); print(d["target_user"])' "$f")
                  [[ -n "${host:-}" && -n "${user:-}" ]] || { echo "handoff.json has no target_host or target_user"; exit 1; }
                  echo "##vso[task.setvariable variable=targetHost]$host"
                  echo "##vso[task.setvariable variable=targetUser]$user"
                displayName: Read the target address from the handoff file
                env:
                  PIPELINE_WS: $(Pipeline.Workspace)
              - template: templates/ansible-site-steps.yml
                parameters:
                  targetHost: $(targetHost)    # runtime macro: set by the step above, so it exists only once that step has run
                  targetUser: $(targetUser)
              - template: templates/failure-report.yml
                parameters:
                  detail: root=$(rootDir)
