# The Ansible steps shared by ado-ansible-run (host typed by a person) and the Deploy stage of
# ado-terraform-deploy (host read from the Terraform output). ADR-0029, ADR-0030.
# The caller passes the host as a literal or as a runtime macro; both land in env: below.
parameters:
  - name: targetHost            # private IP of the target
    type: string
  - name: targetUser            # admin user on the target
    type: string
    default: azureuser

steps:
  - checkout: self
    clean: true                 # a self-hosted agent keeps its work folder between runs; start from a clean copy
    persistCredentials: false   # the Git token is not left in .git/config for later steps

  - bash: |
      set -euo pipefail
      python3 -m venv "$AGENT_TEMP/ansible-venv"
      "$AGENT_TEMP/ansible-venv/bin/pip" install -r ansible/requirements-pipeline.txt -c ansible/constraints.txt
      want=$(sed -n 's/^ansible-core==//p' ansible/requirements.txt)
      got=$("$AGENT_TEMP/ansible-venv/bin/pip" show ansible-core | sed -n 's/^Version: //p')
      echo "ansible-core wanted: $want, installed: $got"
      test "$want" = "$got"
    displayName: Install pinned Ansible into a venv
    env:
      AGENT_TEMP: $(Agent.TempDirectory)   # a per-job folder the agent clears afterwards

  - task: AzureKeyVault@2
    displayName: Read the pipeline SSH key
    inputs:
      azureSubscription: sc-azure-keyvault-shared   # the Key Vault reader connection (ADR-0024)
      KeyVaultName: kv-plat-shared-at01
      SecretsFilter: ansible-pipeline-ssh-key       # one named secret, never '*'
      RunAsPreJob: false                            # fetch at this step, not before the job starts

  - bash: |
      set -euo pipefail
      umask 077                                     # files created below are readable by the agent user only
      printf '%s' "$SSH_KEY" > "$AGENT_TEMP/ansible_key"
      ssh-keygen -y -f "$AGENT_TEMP/ansible_key" | ssh-keygen -lf -   # fails if unreadable; prints fingerprint
    displayName: Write the key to a private file and check it
    env:
      SSH_KEY: $(ansible-pipeline-ssh-key)          # secret variable, passed as an environment variable
      AGENT_TEMP: $(Agent.TempDirectory)

  - bash: |
      set -euo pipefail
      [[ "$TARGET_HOST" =~ ^10\.10\.1\.[0-9]{1,3}$ ]] || { echo "targetHost is $TARGET_HOST, not 10.10.1.x"; exit 1; }
      [[ "$TARGET_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "targetUser is $TARGET_USER, not a name"; exit 1; }
      "$AGENT_TEMP/ansible-venv/bin/ansible" all -i "$TARGET_HOST," -u "$TARGET_USER" \
        --private-key "$AGENT_TEMP/ansible_key" \
        --ssh-common-args="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$AGENT_TEMP/known_hosts" \
        -m ansible.builtin.ping
    displayName: Ansible ping the target
    env:
      TARGET_HOST: ${{ parameters.targetHost }}
      TARGET_USER: ${{ parameters.targetUser }}
      ANSIBLE_CONFIG: $(Build.SourcesDirectory)/ansible/ansible-pipeline.cfg   # skip the root vault config
      AGENT_TEMP: $(Agent.TempDirectory)

  - bash: |
      set -euo pipefail
      [[ "$TARGET_HOST" =~ ^10\.10\.1\.[0-9]{1,3}$ ]] || { echo "targetHost is $TARGET_HOST, not 10.10.1.x"; exit 1; }
      [[ "$TARGET_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "targetUser is $TARGET_USER, not a name"; exit 1; }
      play() {
        "$AGENT_TEMP/ansible-venv/bin/ansible-playbook" ansible/site.yml -i "$TARGET_HOST," -u "$TARGET_USER" \
          --private-key "$AGENT_TEMP/ansible_key" \
          --ssh-common-args="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$AGENT_TEMP/known_hosts"
      }
      echo "=== run 1: apply the role"
      play
      echo "=== run 2: must change nothing"
      play | tee "$AGENT_TEMP/run2.log"
      grep -Eq 'changed=0 +unreachable=0 +failed=0' "$AGENT_TEMP/run2.log"
    displayName: Run site.yml twice and check the second run changes nothing
    env:
      TARGET_HOST: ${{ parameters.targetHost }}
      TARGET_USER: ${{ parameters.targetUser }}
      ANSIBLE_CONFIG: $(Build.SourcesDirectory)/ansible/ansible-pipeline.cfg
      AGENT_TEMP: $(Agent.TempDirectory)

  - bash: |
      set -euo pipefail
      rm -f "$AGENT_TEMP/ansible_key"
      test ! -e "$AGENT_TEMP/ansible_key"
    displayName: Remove the key file and check it is gone
    condition: always()                             # runs even when an earlier step failed
    env:
      AGENT_TEMP: $(Agent.TempDirectory)
