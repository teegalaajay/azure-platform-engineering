# Install the pinned Terraform on a fresh agent and prove which version will run (ADR-0026).
# Names no version itself: the calling pipeline passes the version and the SHA-256 in, so the version
# checker (scripts/check-terraform-version.sh) has one place per pipeline to look at, not one per template.
parameters:
  - name: version               # MAJOR.MINOR.PATCH, from the pipeline's own variables
    type: string
  - name: sha256                # hash of terraform_<version>_linux_amd64.zip from HashiCorp's signed SHA256SUMS
    type: string

steps:
  - bash: |
      set -euo pipefail
      uname -m | grep -qx x86_64
      mkdir -p "$TF_DIR"
      cd "$TF_DIR"
      curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      echo "${TF_SHA256}  terraform_${TF_VERSION}_linux_amd64.zip" | sha256sum -c -
      unzip -q "terraform_${TF_VERSION}_linux_amd64.zip" terraform
      echo "##vso[task.prependpath]${TF_DIR}"
    displayName: Install pinned Terraform
    env:
      TF_VERSION: ${{ parameters.version }}
      TF_SHA256: ${{ parameters.sha256 }}
      TF_DIR: $(Agent.TempDirectory)/terraform

  - bash: |
      set -euo pipefail
      terraform version | grep -Fx "Terraform v${TF_VERSION}"
    displayName: Assert the Terraform version that will run
    env:
      TF_VERSION: ${{ parameters.version }}
